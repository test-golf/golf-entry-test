<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〇〇市民ゴルフ大会 2026</title>

<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  line-height: 1.8;
  background-color: #f5f5f5;
}

/* ===== Hero ===== */
.hero {
  position: relative;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 420px;
  object-fit: cover;
  display: block;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
}

.hero-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffffff;
  text-align: center;
  width: 90%;
}

.hero-text h1 {
  font-weight: 900;
  margin: 0;
  font-size: clamp(20px, 5vw, 40px);
}

/* ===== Container ===== */
.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 8px;
  box-sizing: border-box;
}

h2 {
  border-left: 6px solid #2e7d32;
  padding-left: 10px;
  margin-top: 40px;
}

.map-box {
  margin-top: 20px;
  border-radius: 8px;
  overflow: hidden;
}

.map-box iframe {
  width: 100%;
  height: 350px;
  border: 0;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .hero img {
    height: 24vh;
    min-height: 140px;
    max-height: 220px;
  }

  .container {
    margin: 20px;
    padding: 20px;
  }
}

.footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: #777;
}
</style>
</head>

<body>

<div class="hero">
  <img src="hero.jpg" alt="ゴルフ大会イメージ写真">
  <div class="overlay"></div>
  <div class="hero-text">
    <h1>〇〇市民ゴルフ大会</h1>
    <p>2026年〇月〇日開催</p>
  </div>
</div>

<div class="container">

  <h2>開催概要</h2>
  <p>
    開催日：2026年〇月〇日<br>
    場所：△△カントリー
  </p>

  <h2>申し込み方法（抽選方式）</h2>
  <p>
    抽選日：2026年〇月〇日<br>
    抽選場所：△△<br><br>
    上記抽選会での参加申し込みをもって、正式なお申し込みとなります。
  </p>

  <div class="map-box">
    <iframe
      src="https://www.google.com/maps?q=△△&output=embed"
      loading="lazy">
    </iframe>
  </div>

</div>

<div class="footer">
  © 2026 〇〇市民ゴルフ大会
</div>

</body>
</html>
