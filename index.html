<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〇〇市民ゴルフ大会 2026</title>

<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  line-height: 1.8;
  background-color: #f5f5f5;
}

/* ===== Heroエリア ===== */
.hero {
  position: relative;
  overflow: hidden;
}

/* 画像（最背面） */
.hero img {
  width: 100%;
  height: 420px;
  object-fit: cover;
  display: block;
  position: relative;
  z-index: 0;
}

/* 黒オーバーレイ（中間層） */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.45);
  z-index: 1;
}

/* タイトル（最前面） */
.hero-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffffff;
  text-align: center;
  z-index: 2;
  animation: fadeIn 1.5s ease forwards;
  opacity: 0;
}

.hero-text h1 {
  font-size: 44px;
  margin: 0;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow:
    0 0 5px rgba(0,0,0,0.8),
    0 0 15px rgba(0,0,0,0.8),
    2px 2px 8px rgba(0,0,0,0.9);
}

.hero-text p {
  margin-top: 15px;
  font-size: 20px;
}

/* フェードイン */
@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

/* ===== 本文 ===== */
.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
  border-left: 6px solid #2e7d32;
  padding-left: 10px;
  margin-top: 40px;
  font-size: 24px;
}

ul {
  list-style: none;
  padding-left: 0;
}

li {
  margin-bottom: 12px;
}

a {
  color: #2e7d32;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* ===== フッター ===== */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: #777;
}

/* ===== スマホ対応 ===== */
@media (max-width: 600px) {

  .hero img {
    height: 280px;
  }

  .hero-text h1 {
    font-size: 26px;
  }

  .hero-text p {
    font-size: 16px;
  }

  .container {
    margin: 20px;
    padding: 20px;
  }

}
</style>
</head>

<body>

<!-- ===== Heroエリア ===== -->
<div class="hero">
  <img src="hero.jpg" alt="ゴルフ大会イメージ写真">
  <div class="overlay"></div>
  <div class="hero-text">
    <h1>〇〇市民ゴルフ大会</h1>
    <p>2026年〇月〇日開催</p>
  </div>
</div>

<!-- ===== 本文 ===== -->
<div class="container">

  <h2>開催概要</h2>
  <ul>
    <li>開催日：2026年〇月〇日</li>
    <li>場所：△△カントリー</li>
  </ul>

  <h2>申し込み方法</h2>
  <ul>
    <li><a href="entry_2026.pdf" target="_blank">申込書ダウンロード（PDF）</a></li>
    <li>メールまたはFAXでお送りください。</li>
    <li>送り先：example@example.com</li>
    <li>FAX：000-000-0000</li>
  </ul>

  <h2>過去開催</h2>
  <ul>
    <li><a href="#">2026年大会</a></li>
  </ul>

</div>

<div class="footer">
  © 2026 〇〇市民ゴルフ大会
</div>

</body>
</html>
