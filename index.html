  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;

  background-color: #f5f5f5;
}

.hero {
  position: relative;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
  position: relative;
  z-index: 0;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1;
}

.hero-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffffff;
  text-align: center;
  z-index: 2;
}

.hero-text h1 {
  font-size: 40px;
  margin: 0;
  font-weight: 900;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 8px;
}

h2 {
  border-left: 6px solid #2e7d32;
  padding-left: 10px;
}

iframe {
  width: 100%;
  height: 900px;
  border: none;
  margin-top: 20px;
}
</style>
</head>

  <img src="hero.jpg" alt="">
