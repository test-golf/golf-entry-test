<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〇〇市民ゴルフ大会 2026</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

/* =========================
   HEROエリア
========================= */
.hero {
    position: relative;
    height: 60vh;
    overflow: hidden;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1;
}

.hero-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-size: 3rem;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
    z-index: 2;
    white-space: nowrap;
}

/* =========================
   共通セクション
========================= */
section {
    padding: 40px 20px;
    max-width: 1000px;
    margin: auto;
}

h2 {
    border-bottom: 2px solid #ccc;
    padding-bottom: 10px;
}

a {
    color: #0066cc;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

/* =========================
   ボタン
========================= */
.button {
    display: inline-block;
    padding: 15px 30px;
    background: #0066cc;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-size: 18px;
    margin-top: 10px;
    max-width: 100%;
    box-sizing: border-box;
}

.button:hover {
    background: #004999;
}

/* =========================
   マップ
========================= */
.map-container {
    margin-top: 20px;
    width: 50%;
}

.map-container iframe {
    width: 100%;
    height: 300px;
    border: 0;
}

/* =========================
   年度リンク
========================= */
.year-links {
    margin-top: 30px;
}

/* =========================
   スマホ対応
========================= */
@media (max-width: 768px) {

    /* 画像高さを約6割に */
    .hero {
        height: 35vh;
    }

    .hero-title {
        font-size: 1.4rem;
        white-space: normal;
        width: 90%;
    }

    .map-container {
        width: 100%;
    }

    .button {
        width: 100%;
        text-align: center;
        font-size: 16px;
    }
}

</style>
</head>

<body>

<!-- ヒーロー -->
<div class="hero">
    <img src="hero.jpg" alt="ゴルフ大会イメージ">
    <div class="hero-title">〇〇市民ゴルフ大会 2026</div>
</div>

<!-- 開催概要 -->
<section>
    <h2>開催概要</h2>
    <p>開催日：2026年〇月〇日</p>
    <p>場所：飯能ゴルフクラブ</p>

    <div class="map-container">
        <iframe 
            src="https://www.google.com/maps?q=飯能ゴルフクラブ&output=embed">
        </iframe>
    </div>

    <p>
        <a href="https://www.google.com/maps/search/?api=1&query=飯能ゴルフクラブ" target="_blank" class="button">
            Googleマップで開く
        </a>
    </p>
</section>

<!-- 申し込み方法 -->
<section>
    <h2>申し込み方法</h2>

    <p>
    抽選会での参加申し込みをもって、正式なお申込みとなります。
    </p>

    <p>
    抽選日時：〇年〇月〇日　△時～
    </p>

    <p>
    抽選会開催場所：□□
    </p>

    <div class="map-container">
        <iframe 
            src="https://www.google.com/maps?q=飯能ゴルフクラブ&output=embed">
        </iframe>
    </div>

    <p>
        <a href="https://www.google.com/maps/search/?api=1&query=飯能ゴルフクラブ" target="_blank" class="button">
            Googleマップで開く
        </a>
    </p>
    
</section>

<!-- 問合せ先 -->
<section>
    <h2>問合せ先</h2>
    <p>電話番号：00-0000-0000</p>
    <p>メール：example@example.com</p>
</section>

</body>
</html>
