<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>〇〇市民ゴルフ大会 2026</title>

<style>
body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  line-height: 1.8;
  background-color: #f5f5f5;
}

/* ===== Hero ===== */
.hero {
  position: relative;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 420px;
  object-fit: cover;
  display: block;
  z-index: 0;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1;
}

.hero-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffffff;
  text-align: center;
  z-index: 2;
}

.hero-text h1 {
  font-size: 40px;
  margin: 0;
  font-weight: 900;
}

.hero-text p {
  margin-top: 10px;
  font-size: 18px;
}

/* ===== Container ===== */
.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 8px;
}

h2 {
  border-left: 6px solid #2e7d32;
  padding-left: 10px;
  margin-top: 40px;
}

.notice-box {
  background: #f0f7f1;
  padding: 20px;
  border-radius: 6px;
  margin-top: 15px;
}

a {
  color: #2e7d32;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* ===== フォームボタン ===== */
.form-button {
  display: inline-block;
  padding: 16px 32px;
  background-color: #2e7d32;
  color: #ffffff;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 18px;
  margin-top: 15px;
  transition: 0.3s;
}

.form-button:hover {
  background-color: #1b5e20;
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: #777;
}

@media (max-width: 600px) {

  .hero img {
    height: 280px;
  }

  .hero-text h1 {
    font-size: 26px;
  }

  .hero-text p {
    font-size: 14px;
  }

  .container {
    margin: 20px;
    padding: 20px;
  }

  .form-button {
    width: 100%;
    text-align: center;
  }

}
</style>
</head>

<body>

<!-- ===== Hero ===== -->
<div class="hero">
  <img src="hero.jpg" alt="ゴルフ大会イメージ写真">
  <div class="overlay"></div>
  <div class="hero-text">
    <h1>〇〇市民ゴルフ大会</h1>
    <p>2026年〇月〇日開催</p>
  </div>
</div>

<div class="container">

  <h2>開催概要</h2>
  <p>
    開催日：2026年〇月〇日<br>
    場所：△△カントリー
  </p>

  <h2>申し込み方法</h2>

  <div class="notice-box">
    <p>
      <strong>① PDF申込書をダウンロードし、FAXまたはメールでお申し込み</strong><br>
      ▶ <a href="entry_2026.pdf" target="_blank">申込書ダウンロード（PDF）</a><br><br>
      送付先メール：example@example.com<br>
      FAX：000-000-0000
    </p>
  </div>

  <div class="notice-box">
    <p>
      <strong>② 下記ボタンよりフォームからお申し込み</strong>
    </p>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLScSZ0y8XLDBDwna15nJUlYKzHBaGyz20IeDEbVbUvbQsecLhw/viewform"
       target="_blank"
       class="form-button">
       フォームから申し込む
    </a>
  </div>

</div>

<div class="footer">
  © 2026 〇〇市民ゴルフ大会
</div>

</body>
</html>
